# Web de Amics — despliegue de contenido estático PREBUILT a GitHub Pages.
# El build real (Vite + prerender con Chromium) se hace en local desde el repo
# amics-web (`npm run build:seo`) y se sincroniza aquí a /site con scripts/deploy-pages.sh.
# Este workflow solo publica esa carpeta. No añadir CNAME a la raíz (dominio en Settings).
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
